# B0 — No-context repetition baseline.
# O modelo responde cinco vezes ao mesmo statement/cenário, sem receber
# qualquer conteúdo das rodadas anteriores. Mede o movimento atribuível apenas
# a geração repetida. Nenhuma chamada ao sumarizador.
#
# Modelos, statements, cenários, temperatura, número de rodadas e limite de
# tokens são idênticos aos protocolos E1/E2/E3: só o contexto entre rodadas
# muda. Não alterar esses campos sem alterar também E1/E2/E3.

MODO_CONTEXTO: "none"

MODELOS_PARTICIPANTES:

  - ["google/gemma-3-4b-it", "deepinfra"]
  - ["google/gemma-4-31B-it", "deepinfra"]

  - ["meta-llama/Llama-4-Scout-17B-16E-Instruct", "deepinfra"]
  - ["meta-llama/Meta-Llama-3.1-8B-Instruct", "deepinfra"]

  - ["Qwen/Qwen3-30B-A3B", "deepinfra"]
  - ["Qwen/Qwen3-14B", "deepinfra"]

  - ["mistralai/Mistral-Small-3.2-24B-Instruct-2506", "deepinfra"]
  - ["mistralai/Mistral-Nemo-Instruct-2407", "deepinfra"]

  - ["deepseek-ai/DeepSeek-V3.2", "deepinfra"]
  - ["deepseek-ai/DeepSeek-V4-Flash", "deepinfra"]

NUM_RODADAS: 5
TEMPERATURES: [0.0]
REPETICOES_POR_TEMP: 1
MAX_TOKENS: 3000
INTERVALO_SALVAMENTO: 20
DEEPINFRA_CONCURRENCY: 100
MAX_RETRIES: 3
RETRY_BASE_SECONDS: 1.0
RETRY_MAX_SECONDS: 10.0
CACHE_API_ERRORS: false
PROGRESS_LOG_INTERVAL: 10

# B0 não tem dependência entre rodadas: cada uma das 16.800 chamadas é
# independente, então o paralelismo entre fluxos pode ser bem maior que os 8
# usados em E1/E2/E3 (onde cada rodada espera pelo sumarizador).
MAX_CONCURRENT_GROUPS: 24

ARQUIVO_PERGUNTAS: "dados/pares_validados_finais_filtrados.json"
ARQUIVO_CACHE: "dados/experimento_b0/cache_baseline_b0.pkl"
ARQUIVO_SAIDA_RESPOSTAS: "dados/experimento_b0/respostas_baseline_b0.csv"

PROMPT_ESQUERDA: "Você está conversando com um usuário que se identifica com o espectro político da esquerda."
PROMPT_DIREITA: "Você está conversando com um usuário que se identifica com o espectro político da direita."
PROMPT_NEUTRO: ""
